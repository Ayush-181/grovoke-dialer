<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Call Board Time Zones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.dcm,.dcm *{box-sizing:border-box}
.dcm{--rootbg:radial-gradient(760px 520px at 4% 0%,rgba(10,132,255,.34),transparent 62%),radial-gradient(620px 520px at 0% 100%,rgba(191,90,242,.26),transparent 62%),#18181B;--bg:#1E1E22;--pane:#28282D;--segon:#3D3D45;--side:rgba(38,38,48,.55);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);--text:#F5F5F7;--sub:#ABABB4;--accent:#0A84FF;--accent-t:#6CB0FF;--accent-fill:#0A6CE0;--accent-soft:rgba(10,132,255,.2);--accent-line:rgba(10,132,255,.6);--green:#30D158;--green-t:#5BE384;--green-soft:rgba(48,209,88,.16);--red:#FF453A;--red-t:#FF8179;--red-soft:rgba(255,69,58,.16);--amber:#FF9F0A;--amber-t:#FFB840;--amber-soft:rgba(255,159,10,.16);--key:rgba(255,255,255,.08);--shadow:0 1px 0 rgba(255,255,255,.05) inset,0 14px 32px -16px rgba(0,0,0,.7);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--text);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
.dcm[data-theme="light"]{--rootbg:radial-gradient(760px 520px at 4% 0%,rgba(0,122,255,.2),transparent 62%),radial-gradient(620px 520px at 0% 100%,rgba(175,82,222,.16),transparent 62%),#ECECF1;--bg:#F4F4F8;--pane:#FFFFFF;--segon:#FFFFFF;--side:rgba(246,246,250,.6);--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.14);--text:#1D1D1F;--sub:#5F5F68;--accent:#007AFF;--accent-t:#0062CC;--accent-fill:#0066D6;--accent-soft:rgba(0,122,255,.1);--accent-line:rgba(0,122,255,.5);--green:#28CD41;--green-t:#0E7A2E;--green-soft:rgba(40,205,65,.15);--red:#FF3B30;--red-t:#C9150B;--red-soft:rgba(255,59,48,.12);--amber:#FF9500;--amber-t:#8F5000;--amber-soft:rgba(255,149,0,.16);--key:rgba(0,0,0,.05);--shadow:0 1px 2px rgba(0,0,0,.05),0 14px 28px -16px rgba(0,0,0,.2)}
.dcm button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:"SF Mono","JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tl{display:block;width:12px;height:12px;border-radius:50%}
.eye{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
.sec{font-size:11px;font-weight:600;color:var(--sub);padding:14px 10px 4px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;height:30px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-size:13px;font-weight:500;text-align:left}
.nav-i .i{stroke:var(--accent-t)}
.nav-i .cnt{margin-left:auto;font-size:12px;color:var(--sub)}
.nav-i.on{background:var(--accent-fill);color:#fff}
.nav-i.on .i{stroke:#fff}
.nav-i.on .cnt{color:rgba(255,255,255,.88)}
.panel{background:var(--pane);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--key);font-size:12px;font-weight:500;white-space:nowrap}
.btn.p{background:linear-gradient(180deg,var(--accent),var(--accent-fill));border-color:rgba(255,255,255,.12);color:#fff;font-weight:600;box-shadow:0 8px 18px -8px var(--accent)}
.seg{display:flex;gap:2px;padding:2px;border-radius:9px;background:var(--key)}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;font-size:12px;font-weight:500;color:var(--sub)}
.seg button.on{background:var(--segon);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.mb{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;background:var(--key);font-size:12px;font-weight:500;color:var(--sub);white-space:nowrap}
.mb.on{background:var(--green-soft);color:var(--green-t)}
.mb.br{background:var(--accent-soft);color:var(--accent-t)}
.mb.am{background:var(--amber-soft);color:var(--amber-t)}
.mb.bad{background:var(--red-soft);color:var(--red-t)}
.st{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.av{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-weight:600;font-size:12px;color:#fff;flex:none}
.c0{background:linear-gradient(135deg,#5E5CE6,#4140BF)}
.c1{background:linear-gradient(135deg,#0B8794,#07626B)}
.c2{background:linear-gradient(135deg,#C25A00,#8F4000)}
.c3{background:linear-gradient(135deg,#D6336C,#A3194F)}
.c4{background:linear-gradient(135deg,#167A3A,#0E5A29)}
.c5{background:linear-gradient(135deg,#6B6F80,#4B4E5C)}
.th{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.5fr) minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,1.3fr) 56px;gap:12px;align-items:center;padding:0 16px}
.th>div{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--sub)}
.tr{height:54px;border-top:1px solid var(--line)}
.tr.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.tr .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .sb{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f{display:flex;flex-direction:column;gap:2px}
.f b{font-weight:600;font-size:13px}

.zc{display:flex;flex-direction:column;align-items:flex-start;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--pane);box-shadow:var(--shadow);text-align:left}
.zc.sel{background:linear-gradient(180deg,var(--accent),var(--accent-fill));border-color:transparent;color:#fff;box-shadow:0 14px 30px -12px var(--accent)}
.zc.sel .mb{background:rgba(255,255,255,.22);color:#fff}

</style>
</helmet>
<div class="dcm" data-theme="{{theme}}" style="position: relative; width: 1600px; height: 1000px; display: flex; border-radius: 12px; overflow: hidden; background: var(--rootbg); border: 1px solid var(--line2)">

<aside style="width: 224px; flex: none; display: flex; flex-direction: column; padding: 0 12px 14px; background: var(--side); backdrop-filter: blur(40px) saturate(170%); -webkit-backdrop-filter: blur(40px) saturate(170%); border-right: 1px solid var(--line)">
<div style="height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 8px"><i class="tl" style="background: #FF5F57"></i><i class="tl" style="background: #FEBC2E"></i><i class="tl" style="background: #28C840"></i></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 12px">
<div style="width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(145deg, #4C9AFF, #0A5BD6); display: grid; place-items: center; box-shadow: 0 4px 12px -4px rgba(10,132,255,.7), inset 0 1px 0 rgba(255,255,255,.35)"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></div>
<div><div style="font-weight: 700; font-size: 14px">Call Board</div><div style="font-size: 11px; color: var(--sub)">A better rhythm for sales</div></div>
</div>
<nav aria-label="Main navigation" style="display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="14">
<sc-if value="{{n.isH}}" hint-placeholder-val="{{ false }}"><div class="sec">{{n.label}}</div></sc-if>
<sc-if value="{{n.isI}}" hint-placeholder-val="{{ true }}"><button class="nav-i {{n.cls}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}"></path></svg><span>{{n.label}}</span><sc-if value="{{n.hasCount}}" hint-placeholder-val="{{ false }}"><span class="cnt mono">{{n.count}}</span></sc-if></button></sc-if>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 4px 6px"><div class="av c0" style="width: 32px; height: 32px">A</div><div><div style="font-weight: 600">Ash</div><div style="font-size: 12px; color: var(--sub)">Grovoke</div></div></div>
</aside>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--bg)">
<header style="height: 52px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--line)">
<div style="font-size: 15px; font-weight: 650">Time Zones</div><span class="mb br">Anchored to {{anchorLabel}}</span>
<div style="flex: 1"></div><span style="font-size: 12px; color: var(--sub)">Click a card to see everything in that zone’s time</span>
</header>
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 18px 20px 20px">
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="6">
<button class="zc {{c.cls}}" onClick="{{c.pick}}" aria-pressed="{{c.on}}">
<div style="display: flex; justify-content: space-between; align-items: center; width: 100%"><span class="eye" style="color: inherit; opacity: .85">{{c.abbr}}</span><span class="mb {{c.chipCls}}" style="height: 22px; font-size: 11px">{{c.chip}}</span></div>
<div class="mono" style="font-size: 30px; font-weight: 650; letter-spacing: -.02em; margin-top: 6px">{{c.clock}}</div>
<div style="font-weight: 600; margin-top: 2px">{{c.name}}</div>
<div style="font-size: 12px; opacity: .8">{{c.day}} · {{c.off}}</div>
<div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(128,128,128,.25); width: 100%; font-size: 12px; text-align: left; opacity: .9">{{c.win}}</div>
<div style="font-size: 12px; opacity: .8">{{c.leads}}</div>
</button>
</sc-for>
</div>
<div class="panel" style="flex: 1; min-height: 0; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between"><b style="font-size: 14px">Open hours across the day · in {{anchorShort}}</b><span style="display: flex; gap: 14px; font-size: 12px; color: var(--sub)"><span><i class="st" style="background: var(--green)"></i> Open (9–5, weekdays)</span><span><i class="st" style="background: var(--key); border: 1px solid var(--line2)"></i> Closed</span></span></div>
<div style="display: grid; grid-template-columns: 90px repeat(24, minmax(0, 1fr)); gap: 3px; align-items: center">
<div></div><sc-for list="{{hours}}" as="h" hint-placeholder-count="24"><div class="mono" style="font-size: 10px; color: var(--sub); text-align: center">{{h}}</div></sc-for>
</div>
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="6">
<div style="display: grid; grid-template-columns: 90px repeat(24, minmax(0, 1fr)); gap: 3px; align-items: center"><div style="font-weight: 600">{{t.abbr}}</div><sc-for list="{{t.cells}}" as="x" hint-placeholder-count="24"><i style="display: block; height: 26px; border-radius: 5px; background: {{x.bg}}; box-shadow: {{x.now}}"></i></sc-for></div>
</sc-for>
<div style="margin-top: auto; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--accent-t); font-size: 13px; line-height: 1.5">{{insight}}</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":1600,"height":1000}}'>
class Component extends DCLogic {
  st() { return this.state || {}; }
  renderVals() {
    const s = this.st();

    const I = {
      dash: "M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z",
      users: "M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75",
      phone: "M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z",
      list: "M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01",
      act: "M22 12h-4l-3 9L9 3l-3 9H2",
      cal: "M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM16 2v4M8 2v4M3 10h18",
      clock: "M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2",
      redo: "M1 4v6h6M3.51 15a9 9 0 1 0 2.13-9.36L1 10",
      file: "M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8",
      up: "M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12",
      set: "M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"
    };
    const H = (label) => ({ isH: true, isI: false, label });
    const N = (label, d, extra) => Object.assign({ isH: false, isI: true, label, d, cls: label === 'Time Zones' ? 'on' : '', hasCount: false, count: '' }, extra || {});
    const nav = [
      H('Workspace'), N('Overview', I.dash), N('Leads', I.users, { hasCount: true, count: '248' }),
      N('Dialer', I.phone), N('Sessions', I.list), N('Activity', I.act),
      H('Schedule'), N('Bookings', I.cal), N('Time Zones', I.clock), N('Follow-ups', I.redo, { hasCount: true, count: '4' }),
      H('Setup'), N('Configuration', I.file), N('Data', I.up), N('Settings', I.set)
    ];

    const NOW = Date.UTC(2026, 9, 30, 15, 25);
    const ZONES = [
      ['Asia/Kolkata', 'IST', 'India · you', 0], ['America/New_York', 'ET', 'Eastern', 22], ['America/Chicago', 'CT', 'Central · Austin', 186],
      ['America/Denver', 'MT', 'Mountain', 14], ['America/Phoenix', 'AZ', 'Arizona', 17], ['America/Los_Angeles', 'PT', 'Pacific', 9]
    ];
    const anchor = s.anchor || 'Asia/Kolkata';
    const off = (tz, ms) => {
      const p = {};
      new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' }).formatToParts(new Date(ms)).forEach((x) => { p[x.type] = x.value; });
      return Math.round((Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - Math.floor(ms / 1000) * 1000) / 60000);
    };
    const toUtc = (y, mo, d, h, mi, tz) => { const w = Date.UTC(y, mo - 1, d, h, mi); let g = w; for (let i = 0; i < 3; i++) g = w - off(tz, g) * 60000; return g; };
    const f = (ms, tz, o) => new Intl.DateTimeFormat('en-US', Object.assign({ timeZone: tz }, o)).format(new Date(ms));
    const parts = (ms, tz) => { const p = {}; new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle: 'h23', year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', weekday: 'short' }).formatToParts(new Date(ms)).forEach((x) => { p[x.type] = x.value; }); return p; };
    const isOpen = (ms, tz) => { const p = parts(ms, tz); return p.weekday !== 'Sat' && p.weekday !== 'Sun' && +p.hour >= 9 && +p.hour < 17; };
    const anchorName = ZONES.find((z) => z[0] === anchor);
    const ap = parts(NOW, anchor);
    const dayKey = (ms, tz) => { const p = parts(ms, tz); return Date.UTC(+p.year, +p.month - 1, +p.day); };
    const hm = (m) => { const a = Math.abs(m); return (m < 0 ? '−' : '+') + Math.floor(a / 60) + 'h' + (a % 60 ? ' ' + (a % 60) + 'm' : ''); };
    const cards = ZONES.map(([tz, abbr, name, n]) => {
      const dd = Math.round((dayKey(NOW, tz) - dayKey(NOW, anchor)) / 864e5);
      const isUS = tz.startsWith('America');
      const open = isOpen(NOW, tz);
      const w1 = toUtc(+ap.year, +ap.month, +ap.day, 0, 0, anchor);
      const bw = (h1, h2) => { const p = parts(NOW, tz); const a = toUtc(+p.year, +p.month, +p.day, h1, 0, tz), b = toUtc(+p.year, +p.month, +p.day, h2, 0, tz); return f(a, anchor, { hour: 'numeric', minute: '2-digit', hour12: true }).replace(':00', '') + ' – ' + f(b, anchor, { hour: 'numeric', minute: '2-digit', hour12: true }).replace(':00', ''); };
      return {
        abbr: f(NOW, tz, { timeZoneName: 'short' }).split(' ').pop(), name, clock: f(NOW, tz, { hour: 'numeric', minute: '2-digit', hour12: true }).replace(' ', ' '),
        day: dd === 0 ? 'Today' : dd > 0 ? 'Tomorrow' : 'Yesterday', off: tz === anchor ? 'anchor' : hm(off(tz, NOW) - off(anchor, NOW)),
        chip: !isUS ? 'Home' : open ? 'Open' : 'Closed', chipCls: !isUS ? 'br' : open ? 'on' : 'am',
        win: isUS ? 'Best: 9–11 AM → ' + bw(9, 11) : 'Your working evening',
        leads: isUS ? n + ' leads here' : 'Dial from here',
        cls: tz === anchor ? 'sel' : '', on: tz === anchor, pick: () => this.setState({ anchor: tz })
      };
    });
    const start = toUtc(+ap.year, +ap.month, +ap.day, 0, 0, anchor);
    const nowHr = +ap.hour;
    const hours = []; for (let h = 0; h < 24; h++) hours.push(h % 3 === 0 ? String(h).padStart(2, '0') : '');
    const tracks = ZONES.filter((z) => z[0].startsWith('America')).map(([tz, abbr]) => {
      const cells = []; for (let h = 0; h < 24; h++) { const ms = start + h * 3600000 + 1800000; cells.push({ bg: isOpen(ms, tz) ? 'var(--green)' : 'var(--key)', now: h === nowHr ? 'inset 0 0 0 2px var(--accent-t)' : 'none' }); }
      return { abbr, cells };
    });
    const ctOpen = (() => { let a = -1, b = -1; const tz = 'America/Chicago'; for (let h = 0; h < 24; h++) { if (isOpen(start + h * 3600000 + 1800000, tz)) { if (a < 0) a = h; b = h + 1; } } return a < 0 ? null : [a, b]; })();
    const fh = (h) => f(start + h * 3600000, anchor, { hour: 'numeric', minute: '2-digit', hour12: true });
    const insight = ctOpen ? 'Austin (CT) is open ' + fh(ctOpen[0]) + ' – ' + fh(ctOpen[1]) + ' in ' + (anchorName ? anchorName[1] : 'your zone') + ' today. The blue outline marks right now.' : 'No Austin hours fall on this day in your anchor zone — switch the anchor to see them.';
    return { theme: this.props.theme ?? 'dark', nav, cards, hours, tracks, insight, anchorLabel: anchorName ? anchorName[1] + ' · ' + anchorName[2] : '', anchorShort: anchorName ? anchorName[1] : '' };

  }
}
</script>
</body>
</html>
