<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Call Board Command Palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.dcm,.dcm *{box-sizing:border-box}
.dcm{--rootbg:radial-gradient(700px 420px at 0% 0%,rgba(10,132,255,.32),transparent 62%),radial-gradient(640px 420px at 100% 100%,rgba(191,90,242,.26),transparent 62%),#18181B;--pane:rgba(40,40,48,.82);--line:rgba(255,255,255,.1);--line2:rgba(255,255,255,.18);--text:#F5F5F7;--sub:#ABABB4;--accent:#0A84FF;--accent-t:#6CB0FF;--accent-soft:rgba(10,132,255,.22);--green:#30D158;--green-t:#5BE384;--green-soft:rgba(48,209,88,.16);--red-t:#FF8179;--red-soft:rgba(255,69,58,.16);--amber:#FF9F0A;--amber-t:#FFB840;--amber-soft:rgba(255,159,10,.16);--key:rgba(255,255,255,.08);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--text);font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
.dcm[data-theme="light"]{--rootbg:radial-gradient(700px 420px at 0% 0%,rgba(0,122,255,.2),transparent 62%),radial-gradient(640px 420px at 100% 100%,rgba(175,82,222,.16),transparent 62%),#E9E9F0;--pane:rgba(255,255,255,.86);--line:rgba(0,0,0,.08);--line2:rgba(0,0,0,.14);--text:#1D1D1F;--sub:#5F5F68;--accent:#007AFF;--accent-t:#0062CC;--accent-soft:rgba(0,122,255,.12);--green:#28CD41;--green-t:#0E7A2E;--green-soft:rgba(40,205,65,.15);--red-t:#C9150B;--red-soft:rgba(255,59,48,.12);--amber:#FF9500;--amber-t:#8F5000;--amber-soft:rgba(255,149,0,.16);--key:rgba(0,0,0,.05)}
.dcm button,.dcm input{font:inherit;color:inherit}
.dcm button{cursor:pointer}
.mono{font-family:"SF Mono","JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eye{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
.row{display:flex;align-items:center;gap:12px;width:100%;height:44px;padding:0 12px;border:0;border-radius:10px;background:transparent;text-align:left}
.row.sel{background:var(--accent);color:#fff}
.row.sel .sub,.row.sel .hint{color:rgba(255,255,255,.8)}
.ico{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;flex:none}
.kbd{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:6px;background:var(--key);font-size:11px;font-weight:600;color:var(--sub)}
.row.sel .kbd{background:rgba(255,255,255,.22);color:#fff}
.sub{font-size:12px;color:var(--sub)}
.hint{font-size:12px;color:var(--sub)}
.q{flex:1;min-width:0;height:44px;border:0;outline:0;background:transparent;font-size:19px;font-weight:500}
.q::placeholder{color:var(--sub)}
</style>
</helmet>
<div class="dcm" data-theme="{{theme}}" style="position: relative; width: 960px; height: 640px; border-radius: 12px; overflow: hidden; background: var(--rootbg); border: 1px solid var(--line2)">
<div style="position: absolute; inset: 0; opacity: .5; display: flex; flex-direction: column; gap: 14px; padding: 28px 36px; filter: blur(2px)">
<div style="height: 22px; width: 220px; border-radius: 8px; background: var(--key)"></div>
<div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px"><div style="height: 90px; border-radius: 14px; background: var(--key)"></div><div style="height: 90px; border-radius: 14px; background: var(--key)"></div><div style="height: 90px; border-radius: 14px; background: var(--key)"></div><div style="height: 90px; border-radius: 14px; background: var(--key)"></div></div>
<div style="height: 260px; border-radius: 14px; background: var(--key)"></div>
</div>

<div style="position: absolute; left: 140px; top: 70px; width: 680px; display: flex; flex-direction: column; border-radius: 18px; background: var(--pane); backdrop-filter: blur(40px) saturate(170%); -webkit-backdrop-filter: blur(40px) saturate(170%); border: 1px solid var(--line2); box-shadow: 0 40px 90px -20px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.08); overflow: hidden">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 18px; border-bottom: 1px solid var(--line)">
<svg class="i" viewBox="0 0 24 24" style="width: 20px; height: 20px; color: var(--sub)" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
<input class="q" placeholder="Search leads, pages — or type a number to dial" value="{{query}}" onChange="{{onQuery}}" onKeyDown="{{onKey}}" aria-label="Command palette search">
<span class="kbd">esc</span>
</div>

<div style="display: flex; flex-direction: column; gap: 2px; padding: 8px; max-height: 420px; overflow: auto">
<sc-if value="{{hasNone}}" hint-placeholder-val="{{ false }}"><div style="padding: 36px 12px; text-align: center; color: var(--sub)">No results for “{{query}}”. Try a lead name, a page, or a phone number.</div></sc-if>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div>
<div class="eye" style="padding: 8px 12px 4px">{{g.title}}</div>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="4">
<button class="row {{it.cls}}" onMouseEnter="{{it.hover}}" onClick="{{it.run}}">
<span class="ico" style="background: {{it.bg}}; color: {{it.fg}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{it.icon}}"></path></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</span><span class="sub" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.sub}}</span></span>
<span class="hint mono">{{it.right}}</span>
<sc-if value="{{it.sel}}" hint-placeholder-val="{{ false }}"><span class="kbd">↵</span></sc-if>
</button>
</sc-for>
</div>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 16px; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--sub)">
<span style="display: inline-flex; align-items: center; gap: 6px"><span class="kbd">↑</span><span class="kbd">↓</span> navigate</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span class="kbd">↵</span> open</span>
<span style="margin-left: auto" class="mono">{{countText}}</span>
</div>
</div>

<sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 50%; bottom: 36px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 22px; background: var(--pane); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid var(--line2); box-shadow: 0 20px 40px -16px rgba(0,0,0,.6); font-weight: 600"><i style="width: 8px; height: 8px; border-radius: 50%; background: var(--green)"></i>{{toast}}</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","default":"dark","options":["dark","light"]},"$preview":{"width":960,"height":640}}'>
class Component extends DCLogic {
  st() { return this.state || {}; }
  componentWillUnmount() { if (this._t) clearTimeout(this._t); }
  renderVals() {
    const s = this.st();
    const q = s.q === undefined ? '' : s.q;
    const ql = q.trim().toLowerCase();
    const digits = q.replace(/\D/g, '');
    const IC = {
      dial: 'M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z',
      grid: 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z',
      users: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      clock: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2',
      list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
      gear: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z',
      plus: 'M12 5v14M5 12h14',
      moon: 'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z',
      zap: 'M13 2L3 14h9l-1 8 10-12h-9l1-8z',
      user: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'
    };
    const LEADS = [
      ['Lone Star Heating & Air', '(512) 555-0148', 'Round Rock', 'Mike Dawson', 'Owner'],
      ['Bluebonnet Mechanical', '(512) 555-0172', 'Austin', 'Priya Nair', 'GM'],
      ['Zilker Cooling Co.', '(512) 555-0119', 'Austin', 'Dan Whitaker', 'Owner'],
      ['Capital City Comfort', '(737) 555-0134', 'Pflugerville', 'Sara Lopez', 'Owner'],
      ['Hill Country HVAC', '(512) 555-0191', 'Dripping Springs', 'Tom Reyes', 'Owner'],
      ['Barton Springs Air', '(512) 555-0126', 'Austin', 'Jenna Cole', 'Ops manager'],
      ['Live Oak Climate', '(737) 555-0187', 'Cedar Park', 'Ray Hutchins', 'Owner'],
      ['Mueller Mechanical', '(512) 555-0153', 'Austin', 'Alan Ortiz', 'Owner']
    ];
    const PAGES = [
      ['Dialer', 'Call guide and live call', IC.dial, '⌘1'], ['Overview', 'Today’s stats and activity', IC.grid, '⌘2'], ['Leads', 'All leads and queues', IC.users, '⌘3'],
      ['Sessions', 'Calling sessions', IC.list, '⌘4'], ['Time Zones', 'Who is open right now', IC.clock, '⌘5'], ['Activity', 'Call log and recordings', IC.list, '⌘6'], ['Settings', 'Mic, Twilio, defaults', IC.gear, '⌘,']
    ];
    const ACTS = [
      ['Start calling next lead', 'Jump to the top of the queue', IC.zap, '⌘↵'], ['Open floating dialpad', 'Dial any number, even outside your leads', IC.dial, '⌘D'],
      ['Add a lead', 'Create a new lead manually', IC.plus, '⌘N'], ['Switch theme', 'Dark / light', IC.moon, '⌘⇧L']
    ];
    const match = (t) => !ql || t.toLowerCase().includes(ql) || (digits.length > 2 && t.replace(/\D/g, '').includes(digits));
    const fmtDial = () => {
      let o = '+1 (' + digits.slice(0, 3);
      if (digits.length >= 3) o += ')';
      if (digits.length > 3) o += ' ' + digits.slice(3, 6);
      if (digits.length > 6) o += '-' + digits.slice(6, 10);
      return o;
    };
    const flat = [];
    const pushGroup = (title, items) => { if (items.length) flat.push({ title, items }); };
    const dialItems = [];
    if (digits.length >= 3 && /^[\d\s().+-]+$/.test(q.trim())) {
      const ok = digits.length === 10 && !'01'.includes(digits[0]) && !'01'.includes(digits[3]);
      dialItems.push({ title: ok ? 'Dial ' + fmtDial() : 'Dial ' + fmtDial() + '…', sub: ok ? 'Opens the floating dialpad · not in your leads unless it matches' : digits.length < 10 ? (10 - digits.length) + ' more digit' + (10 - digits.length === 1 ? '' : 's') + ' needed' : 'Not a valid US number', icon: IC.dial, bg: 'var(--green-soft)', fg: 'var(--green-t)', right: '', act: ok ? 'Dialpad opened for ' + fmtDial() : 'Finish the number first' });
    }
    pushGroup('Dial', dialItems);
    pushGroup('Leads', LEADS.filter((l) => match(l[0] + ' ' + l[1] + ' ' + l[2] + ' ' + l[3])).slice(0, 4).map((l) => ({ title: l[0], sub: l[3] + ' · ' + l[4] + ' · ' + l[2], icon: IC.user, bg: 'var(--accent-soft)', fg: 'var(--accent-t)', right: l[1], act: 'Loaded ' + l[0] + ' into the dialer' })));
    pushGroup('Pages', PAGES.filter((p) => match(p[0] + ' ' + p[1])).map((p) => ({ title: p[0], sub: p[1], icon: p[2], bg: 'var(--key)', fg: 'var(--sub)', right: p[3], act: 'Going to ' + p[0] })));
    pushGroup('Actions', ACTS.filter((a) => match(a[0] + ' ' + a[1])).map((a) => ({ title: a[0], sub: a[1], icon: a[2], bg: 'var(--amber-soft)', fg: 'var(--amber-t)', right: a[3], act: a[0] + ' — done' })));
    const all = [];
    flat.forEach((g) => g.items.forEach((it) => all.push(it)));
    const sel = Math.min(s.sel || 0, Math.max(all.length - 1, 0));
    const run = (it) => {
      if (this._t) clearTimeout(this._t);
      this.setState({ toast: it.act });
      this._t = setTimeout(() => this.setState({ toast: '' }), 1800);
    };
    let n = 0;
    const groups = flat.map((g) => ({
      title: g.title,
      items: g.items.map((it) => {
        const idx = n++;
        return { title: it.title, sub: it.sub, icon: it.icon, bg: it.bg, fg: it.fg, right: it.right, sel: idx === sel, cls: idx === sel ? 'sel' : '', hover: () => this.setState({ sel: idx }), run: () => run(it) };
      })
    }));
    return {
      theme: this.props.theme ?? 'dark', query: q, groups, hasNone: all.length === 0,
      countText: all.length + (all.length === 1 ? ' result' : ' results'),
      hasToast: !!s.toast, toast: s.toast || '',
      onQuery: (e) => this.setState({ q: (e && e.target ? e.target.value : e) || '', sel: 0 }),
      onKey: (e) => {
        if (!e) return;
        if (e.key === 'ArrowDown') { if (e.preventDefault) e.preventDefault(); this.setState({ sel: Math.min(sel + 1, all.length - 1) }); }
        else if (e.key === 'ArrowUp') { if (e.preventDefault) e.preventDefault(); this.setState({ sel: Math.max(sel - 1, 0) }); }
        else if (e.key === 'Enter' && all[sel]) run(all[sel]);
      }
    };
  }
}
</script>
</body>
</html>
